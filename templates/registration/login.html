{% extends "base.html" %}
{% block titulo %}Entrar · PerdeuAchou{% endblock %}

{% block conteudo %}
  <form class="auth-card" method="post">
    {% csrf_token %}
    <h1>Entrar</h1>
    {% if form.errors %}<p class="erro">Usuário ou senha incorretos.</p>{% endif %}
    <label>Usuário {{ form.username }}</label>
    <label>Senha {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn-azul">Entrar</button>
    <p class="auth-troca">Não tem conta? <a href="{% url 'cadastro' %}">Criar conta</a></p>
  </form>
{% endblock %}
